name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest
    env:
      SWEETLINK_SECRET: ci-standalone-secret-key-for-tests-only
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build packages and example
        run: |
          pnpm build
          pnpm --dir shared build
          pnpm --dir examples/basic-web build

      - name: Check built entrypoints
        run: |
          node dist/src/index.js --help
          node dist/daemon/src/index.js --help
